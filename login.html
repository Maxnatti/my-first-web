<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
    }
    .card {
      background: #222;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      color: white;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #00ff88;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>เข้าสู่ระบบ</h2>
    <input type="tel" placeholder="เบอร์โทร">
    <input type="password" placeholder="รหัสผ่าน">
    <button onclick="login()">เข้าสู่ระบบ</button>
  </div><script>
  function login() {
    const phone = document.querySelector('input[type="tel"]').value;
    const password = document.querySelector('input[type="password"]').value;

    // ดึงข้อมูลที่สมัครไว้
    const savedPhone = localStorage.getItem("phone");
    const savedPass = localStorage.getItem("password");

    if (phone === savedPhone && password === savedPass) {
      window.location.href = "home.html";
    } else {
      alert("เบอร์หรือรหัสผ่านไม่ถูกต้อง");
    }
  }
</script>
</body>
</html>
